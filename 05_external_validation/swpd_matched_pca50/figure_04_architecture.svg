   </g>
   <g id="text_8">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(570.991513 182.7852)">Identical OLS</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(582.545966 192.863231)">50 → 50</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(578.041044 202.941262)">per target</text>
   </g>
   <g id="text_9">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(707.052217 182.7852)">Held-out</text>
