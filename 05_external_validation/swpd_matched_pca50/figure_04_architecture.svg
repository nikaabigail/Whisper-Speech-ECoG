   <g id="text_1">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(77.504012 106.884307)">ECoG</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(71.101356 116.962338)">1024 Hz</text>
   </g>
   <g id="text_2">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(216.795547 106.884307)">70–170 Hz envelope</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(200.838828 116.962338)">50 ms window / 20 ms step</text>
   </g>
   <g id="text_3">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(421.408562 106.884307)">Train-only</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(408.180671 116.962338)">Scaler + PCA50</text>
   </g>
   <g id="text_4">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(54.655262 298.584091)">Recorded audio</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(74.221825 308.662122)">48 kHz</text>
   </g>
   <g id="text_5">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(247.690156 253.854141)">MEL80</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(249.7475 263.932172)">50 Hz</text>
   </g>
   <g id="text_6">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(232.214375 338.275025)">Whisper-base</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(218.031641 348.353056)">encoder L3 / L4 / L5</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(249.7475 358.431087)">50 Hz</text>
   </g>
   <g id="text_7">
    <text style="font: 9px 'DejaVu Sans'" transform="translate(399.918249 293.545075)">Separate train-only</text>
    <text style="font: 9px 'DejaVu Sans'" transform="translate(408.180671 303.623106)">Scaler + PCA50</text>
